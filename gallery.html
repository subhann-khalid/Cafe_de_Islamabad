<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe De Islamabad - Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Shared Navigation Bar -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand-logo">Cafe De Islamabad</a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="menu.html">Menu</a></li>
                    <li><a href="gallery.html" class="active">Gallery</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Gallery Content -->
    <main class="container">
        <section class="page-header">
            <h1>Our Café Gallery</h1>
            <p class="tagline">A glimpse into our cozy atmosphere, freshly brewed coffee, and homemade treats.</p>
        </section>

        <!-- Photo Grid -->
        <section class="gallery-grid">
            <figure class="gallery-card">
                <div class="gallery-img-wrapper">
                    <img src="https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=600&q=80" alt="Cozy Café Interior" class="gallery-img">
                </div>
                <figcaption class="gallery-caption">Warm &amp; Cozy Seating Area in F-7 Markaz</figcaption>
            </figure>

            <figure class="gallery-card">
                <div class="gallery-img-wrapper">
                    <img src="https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=600&q=80" alt="Fresh Latte Art" class="gallery-img">
                </div>
                <figcaption class="gallery-caption">Handcrafted Latte Art by Our Baristas</figcaption>
            </figure>

            <figure class="gallery-card">
                <div class="gallery-img-wrapper">
                    <img src="https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=600&q=80" alt="Fresh Pastries and Croissants" class="gallery-img">
                </div>
                <figcaption class="gallery-caption">Morning Batch of Golden Butter Croissants</figcaption>
            </figure>

            <figure class="gallery-card">
                <div class="gallery-img-wrapper">
                    <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=600&q=80" alt="Coffee Table Setup" class="gallery-img">
                </div>
                <figcaption class="gallery-caption">Perfect Study &amp; Catch-Up Corner</figcaption>
            </figure>

            <figure class="gallery-card">
                <div class="gallery-img-wrapper">
                    <img src="https://images.unsplash.com/photo-1461023058943-07fcbe16d735?auto=format&fit=crop&w=600&q=80" alt="Iced Caramel Coffee" class="gallery-img">
                </div>
                <figcaption class="gallery-caption">Chilled Iced Caramel Macchiato</figcaption>
            </figure>

            <figure class="gallery-card">
                <div class="gallery-img-wrapper">
                    <img src="https://images.unsplash.com/photo-1563729784474-d77dbb933a9e?auto=format&fit=crop&w=600&q=80" alt="Assorted Café Desserts" class="gallery-img">
                </div>
                <figcaption class="gallery-caption">Signature Cakes &amp; Sweet Treats</figcaption>
            </figure>
        </section>
    </main>

    <!-- Shared Footer -->
    <footer class="footer">
        <p>&copy; 2026 Cafe De Islamabad | F-7 Markaz, Islamabad</p>
        <p class="student-credit">Developed by Muhammad Subhan Khalid (26i-3247) - BS SE-E</p>
    </footer>

</html>
